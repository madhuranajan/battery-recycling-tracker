<!DOCTYPE html>
<html>
<head>
    <title>Battery Recycling Tracker</title>
</head>

<body>

    <h1>🔋 Battery Recycling Tracker</h1>

    <p>Track used batteries collected for recycling.</p>

    <h2>Add Battery Record</h2>

    <form action="/add" method="POST">

        <label>Battery Type:</label>
        <input type="text" name="battery_type" required>

        <br><br>

        <label>Quantity:</label>
        <input type="number" name="quantity" required>

        <br><br>

        <label>Location:</label>
        <input type="text" name="location" required>

        <br><br>

        <button type="submit">Add Record</button>

    </form>

    <h2>Battery Records</h2>

    {% for battery in batteries %}

        <div>
            <p><b>Battery Type:</b> {{ battery.type }}</p>
            <p><b>Quantity:</b> {{ battery.quantity }}</p>
            <p><b>Location:</b> {{ battery.location }}</p>
            <p><b>Status:</b> {{ battery.status }}</p>
            <hr>
        </div>

    {% endfor %}

</body>
</html>
